appId: com.parthseva.manager
productName: ParthSeva Manager
copyright: Copyright © 2026 ParthSeva

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ParthSeva Manager
